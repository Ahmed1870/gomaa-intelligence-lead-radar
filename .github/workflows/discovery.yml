name: Autonomous Discovery Radar

on:
  workflow_dispatch:
    inputs:
      task_limit:
        description: Tasks to process
        required: false
        default: "120"
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: gomaa-radar-database
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore radar database
        uses: actions/cache@v4
        with:
          path: data/jobs.db*
          key: gomaa-radar-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gomaa-radar-db-${{ github.ref_name }}-
            gomaa-radar-db-
      - run: python -m app init-db
      - run: python -m app discover --limit "${{ inputs.task_limit || '120' }}" --max-pages 30
      - run: python -m app report
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_number }}
          path: reports/
